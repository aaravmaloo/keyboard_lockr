name: release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install mingw
        run: sudo apt-get install -y mingw-w64
      - name: build
        run: make release
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: klock-windows
          path: klock.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: import signing certificate
        id: cert
        env:
          CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "no MAC_CERT_P12 secret, falling back to ad-hoc signing"
            echo "identity=-" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KC="$RUNNER_TEMP/klock.keychain-db"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p ci "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC"
          security list-keychains -d user -s "$KC" login.keychain-db
          echo "identity=Klock Dev" >> "$GITHUB_OUTPUT"
      - name: build app bundle
        run: make bundle SIGN_ID="${{ steps.cert.outputs.identity }}"
      - name: zip app bundle
        run: ditto -c -k --sequesterRsrc --keepParent Klock.app Klock-macos.zip
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: klock-macos
          path: Klock-macos.zip

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: klock-windows
      - uses: actions/download-artifact@v4
        with:
          name: klock-macos
      - name: release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            klock.exe
            Klock-macos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
